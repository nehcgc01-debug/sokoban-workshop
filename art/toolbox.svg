<path d="M51 70c-16-14-24-2-13 6 6 4 13-3 13-6Zm0 0c16-14 24-2 13 6-6 4-13-3-13-6Z" fill="#f07a6f" stroke-width="2.5"/>
<circle cx="51" cy="70" r="5" fill="#f3c66a" stroke-width="2"/>
<!-- tag with a rope coil -->
<path d="M62 74l16 14" stroke="#3f2e25" stroke-width="2" fill="none"/>
<path d="M74 84l22-6 6 20-22 6Z" fill="#f6e6c4" stroke-width="2.5"/>
<g fill="none" stroke="#2f8f7c" stroke-width="2.2"><circle cx="88" cy="92" r="6"/><circle cx="88" cy="92" r="2.6"/></g>
</g></svg>
